- id: http-generic
  protocol: HTTP
  product: ""
  priority: 10
  confidence: 0.6
  match:
    any:
      - '(?m)^HTTP/1\.[01] [1-5][0-9][0-9]'
      - "(?m)^HTTP/2 [1-5][0-9][0-9]"
      - '(?im)^Server:\s*\S'
      - '(?im)^(Date|Content-Type|Content-Length|X-Powered-By):\s'
