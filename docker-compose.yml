# Banner 指纹识别系统 —— Docker Compose 一键启动
#
#   docker compose up --build
#
# 启动行为：server 先起，健康检查通过后 client 才启动，完成一次端到端批量识别。
#
# 常用命令：
#   docker compose logs -f server
#   docker compose run --rm client -server http://server:8080 -file /data/input.json -output json
#   docker compose down
#
# 需要从宿主机手工调试接口时，叠加 deploy/compose.debug.yml：
#   docker compose -f docker-compose.yml -f deploy/compose.debug.yml up -d --build

name: huashun-fingerprint

services:
  server:
    image: huashun/fingerprint-server:1.0.0
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
      args:
        VERSION: "1.0.0"
        COMMIT: "${GIT_COMMIT:-none}"
        BUILD_DATE: "${BUILD_DATE:-unknown}"
    environment:
      SERVER_ADDR: ":8080"
      LOG_LEVEL: "info"
      # 规则来源：
      #   置空        → 使用 go:embed 编进二进制里的内嵌规则（镜像自包含）
      #   指向目录    → 使用该目录下的 YAML，实现「改规则不用改代码、不用重建镜像」
      RULES_DIR: "/app/rules"
    volumes:
      # 只读挂载规则目录。这条挂载本身就是"规则与代码解耦"的证明：
      # 改 ./rules/*.yaml 后 docker compose restart server 即可生效。
      - ./rules:/app/rules:ro
    # 只声明容器端口，不做端口映射 —— 收敛访问面：
    # server 只允许指纹网络内的 client 访问，宿主机的其它进程无从直接连入。
    expose:
      - "8080"
    networks:
      - fingerprint-net

    # ---------- 运行时安全加固 ----------
    user: "65532:65532" # 非 root（distroless nonroot 用户）
    read_only: true # 根文件系统只读，杜绝运行期写入
    tmpfs:
      - /tmp # 只读根下仍需要一个可写临时目录
    cap_drop:
      - ALL # 丢弃全部 Linux capabilities
    security_opt:
      - no-new-privileges:true # 禁止通过 setuid 等提权
    init: true # 由 tini 回收僵尸进程

    restart: unless-stopped

    # ---------- 真实的健康检测 ----------
    # 不是 sleep，也不是"容器跑起来了"：探针真的会打 /health，
    # 只有规则加载成功、HTTP 服务可响应才算健康，client 才会被放行。
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 5

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 256 # 限制进程数，抑制 fork 炸弹
        reservations:
          cpus: "0.10"
          memory: 64M

  client:
    image: huashun/fingerprint-client:1.0.0
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
      args:
        VERSION: "1.0.0"
    environment:
      # 通过 compose 服务名访问，依赖 Docker 内置 DNS 在内部网络里解析，
      # 不经过宿主机、不依赖端口映射。
      SERVER_URL: "http://server:8080"
      INPUT_FILE: "/data/input.json"
    volumes:
      # 自测数据只读挂载，换成真实扫描结果文件即可。
      - ./testdata:/data:ro

    # 启动依赖是"健康"，不是"已启动"：server 探针返回 200 之前 client 不会跑。
    depends_on:
      server:
        condition: service_healthy

    networks:
      - fingerprint-net

    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 128

networks:
  fingerprint-net:
    driver: bridge
    # internal: true → 该网络没有对外网关。
    # 容器之间可互访，但容器不能主动访问外网，收敛出口流量。
    internal: true
